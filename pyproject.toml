[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allegro-rod-mvp"
version = "0.1.0"
description = "MuJoCo PPO MVP for tactile in-hand rod rotation"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.3,<4",
  "gymnasium>=1.1,<2",
  "stable-baselines3>=2.6,<3",
  "numpy>=1.26",
]

[tool.setuptools]
packages = ["allegro_rod_mvp"]
